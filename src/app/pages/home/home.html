<main class="home">
  <h1>{{ i18n.t('chooseGame') }}</h1>
  <section class="mode">
    <div class="starters" aria-hidden="true">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="" />
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" alt="" />
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="" />
    </div>
    <div class="mode-copy"><h2>Ten Pick</h2><span>{{ i18n.t('tenPickHubTagline') }}</span></div>
    <a routerLink="/ten-pick">{{ i18n.t('play') }}</a>
  </section>
  <section class="mode">
    <div class="gacha-icon" aria-hidden="true">
      <img src="images/gacha/pokegacha.png" alt="" />
    </div>
    <div class="mode-copy"><h2>PokeGacha</h2><span>{{ i18n.t('pokeGachaTagline') }}</span></div>
    <a routerLink="/poke-gacha">{{ i18n.t('playPokeGacha') }}</a>
  </section>
</main>
